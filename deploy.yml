name: E-Label-Seiten bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # taeglich 04:15 UTC: uebernimmt Aenderungen aus den Shopify-Stammdaten
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stammdaten aus Shopify holen
        env:
          SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: python3 fetch_shopify.py

      - name: Schrift und Bilder lokal ablegen
        run: python3 fetch_assets.py

      - name: Seiten bauen
        env:
          LOCAL_ASSETS: "1"
        run: python3 build.py

      - name: Archivkopie versionieren
        run: |
          mkdir -p archive
          cp wines.json "archive/wines-$(date +%Y-%m-%d).json"
          git config user.name  "e-label-bot"
          git config user.email "noreply@chateaulasuite.com"
          git add archive wines.json URLS.md
          git diff --cached --quiet || git commit -m "Datenstand $(date +%Y-%m-%d)"
          git push || true

      - name: Veröffentlichen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
